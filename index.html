<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SHIN CHAN</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="00_Web/css/style.css">
    <script src="00_Web/js/config.js" defer></script>
</head>

<body class="bg-background text-on-surface">

    <header class="fixed top-0 w-full z-50 bg-[#f6f6f6]/80 backdrop-blur-xl flex items-center justify-between px-6 h-16">
        <a href="index.html">
            <div class="flex items-center gap-4">
                <span class="text-xl font-black tracking-tighter text-[#6d5a00] font-headline">SHIN CHAN</span>
            </div>
        </a>
        <div class="hidden md:flex gap-8 items-center">
            <nav class="flex gap-6 text-[#6d5a00] font-bold font-headline tracking-tight">
                <a class="text-[#6d5a00] hover:scale-105 transition-transform border-b-2 border-[#6d5a00]" href="index.html">Home</a>
                <a class="text-[#2d2f2f] hover:text-[#6d5a00] hover:scale-105 transition-all" href="00_Web/seasons.html">Seasons</a>
                <a class="text-[#2d2f2f] hover:text-[#6d5a00] hover:scale-105 transition-all" href="00_Web/favorites.html">Favorites</a>
            </nav>
            <button class="material-symbols-outlined text-[#2d2f2f] hover:scale-105 transition-transform">search</button>
        </div>
    </header>

    <main class="pt-24 pb-32 px-6 max-w-7xl mx-auto space-y-12">
        <section class="relative w-full min-h-[500px] flex items-center overflow-hidden rounded-lg bg-surface-container-low group">
            <div class="z-10 w-full md:w-1/2 p-12 space-y-6">
                <h1 class="text-6xl md:text-8xl font-black text-on-surface leading-[0.9] tracking-tighter">
                    Shin-chan
                </h1>
                <div class="flex gap-4 pt-4">
                    <button class="bg-primary-container text-on-primary-container font-bold px-8 py-4 rounded-full flex items-center gap-2 hover:scale-105 active:scale-95 transition-all shadow-lg" onclick="window.location.href='00_Web/episodes.html?season=1'">
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                        Watch now
                    </button>
                    <button class="bg-surface-container-lowest text-on-surface font-bold px-8 py-4 rounded-full border border-outline-variant/10 hover:scale-105 active:scale-95 transition-all" onclick="playRandomEpisodeHome()">
                        <span class="material-symbols-outlined align-middle mr-1">shuffle</span>Random episode
                    </button>
                </div>
            </div>
            <div class="absolute right-0 top-0 w-full md:w-2/3 h-full overflow-hidden pointer-events-none">
                <img class="w-full h-full object-cover scale-110 group-hover:scale-100 transition-transform duration-1000" 
                     id="hero-image" alt="" />
                <div class="absolute inset-0 bg-gradient-to-r from-surface-container-low via-surface-container-low/40 to-transparent"></div>
            </div>
        </section>

        <section class="space-y-6">
            <div class="flex justify-between items-end">
                <h2 class="text-3xl font-black tracking-tight text-on-surface">Seasons</h2>
                <a href="00_Web/seasons.html" class="text-primary font-bold hover:underline flex items-center gap-1">
                    View all <span class="material-symbols-outlined text-sm">arrow_forward_ios</span>
                </a>
            </div>
            <div id="home-seasons" class="flex gap-6 overflow-x-auto pb-4 snap-x no-scrollbar">
                <div class="text-on-surface-variant py-8">Loading seasons...</div>
            </div>
        </section>

        <section class="space-y-6">
            <h2 class="text-3xl font-black tracking-tight text-on-surface">Recent Episodes</h2>
            <div id="home-recent" class="flex gap-6 overflow-x-auto pb-8 snap-x no-scrollbar">
                <div class="text-on-surface-variant py-8">Loading episodes...</div>
            </div>
        </section>

        <section class="bg-surface-container-low rounded-xl p-8 md:p-12 space-y-8">
            <div class="flex justify-between items-center">
                <h2 class="text-3xl font-black tracking-tight text-on-surface">My Favorites</h2>
                <div class="flex gap-2">
                    <button class="w-10 h-10 rounded-full bg-surface-container-lowest flex items-center justify-center hover:bg-primary-container shadow-sm transition-colors" onclick="scrollFavorites(-1)" aria-label="Previous">
                        <span class="material-symbols-outlined">chevron_left</span>
                    </button>
                    <button class="w-10 h-10 rounded-full bg-surface-container-lowest flex items-center justify-center hover:bg-primary-container shadow-sm transition-colors" onclick="scrollFavorites(1)" aria-label="Next">
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
            </div>
            <div id="home-favorites" class="flex gap-6 overflow-x-auto pb-2 snap-x no-scrollbar">
                <div class="text-on-surface-variant py-4">Loading favorites...</div>
            </div>
        </section>

    </main>

    <nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-3 pb-6 bg-white/90 backdrop-blur-2xl shadow-2xl rounded-t-[2.5rem]">
        <a class="flex flex-col items-center justify-center bg-[#fdd400] text-[#594a00] rounded-full px-6 py-2 active:scale-110 transition-all" href="index.html">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
            <span class="text-[11px] font-bold">Home</span>
        </a>
        <a class="flex flex-col items-center justify-center text-[#2d2f2f] px-6 py-2 active:scale-110 transition-all" href="00_Web/seasons.html">
            <span class="material-symbols-outlined">subscriptions</span>
            <span class="text-[11px] font-bold">Seasons</span>
        </a>
        <a class="flex flex-col items-center justify-center text-[#2d2f2f] px-6 py-2 active:scale-110 transition-all" href="00_Web/favorites.html">
            <span class="material-symbols-outlined">favorite</span>
            <span class="text-[11px] font-bold">Favorites</span>
        </a>
    </nav>

    <script src="00_Web/js/favorites.js"></script>
    <script src="00_Web/js/archive.js"></script>
    <script src="00_Web/js/search.js"></script>
    <script src="00_Web/js/home.js"></script>
</body>
</html>
