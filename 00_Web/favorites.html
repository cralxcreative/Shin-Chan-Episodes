<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Favorites - SHIN CHAN</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js" defer></script>
</head>

<body class="bg-surface text-on-surface min-h-screen">

    <header class="fixed top-0 w-full z-50 bg-[#f6f6f6]/80 backdrop-blur-xl flex items-center justify-between px-6 h-16">
        <a href="../index.html">
            <div class="flex items-center gap-4">
                <span class="text-xl font-black tracking-tighter text-[#6d5a00] font-headline">SHIN CHAN</span>
            </div>
        </a>
        <div class="hidden md:flex gap-8 items-center">
            <nav class="flex gap-6 text-[#2d2f2f] font-bold font-headline tracking-tight">
                <a class="text-[#2d2f2f] hover:text-[#6d5a00] hover:scale-105 transition-all" href="../index.html">Home</a>
                <a class="text-[#2d2f2f] hover:text-[#6d5a00] hover:scale-105 transition-all" href="seasons.html">Seasons</a>
                <a class="text-[#6d5a00] hover:scale-105 transition-transform border-b-2 border-[#6d5a00]" href="favorites.html">Favorites</a>
            </nav>
            <button class="material-symbols-outlined text-[#2d2f2f] hover:scale-105 transition-transform">search</button>
        </div>
    </header>

    <main class="pt-24 pb-32 px-6 max-w-7xl mx-auto">
        <div class="mb-12">
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter text-on-surface mb-4 leading-[0.9]">
                <span class="text-primary">Favorites</span>
            </h1>
            <p class="text-on-surface-variant max-w-md text-lg" id="favorites-count"></p>
        </div>

        <div id="favorites-empty" class="hidden rounded-lg bg-surface-container-low p-12 text-center space-y-4">
            <span class="material-symbols-outlined text-6xl text-on-surface-variant">favorite</span>
            <p class="text-on-surface-variant text-lg">No favorites yet. Tap the heart on any episode to save it here.</p>
            <a href="seasons.html" class="inline-block bg-primary-container text-on-primary-container px-8 py-4 rounded-full font-bold hover:scale-105 transition-transform">Browse seasons</a>
        </div>

        <div id="favorites-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-3 pb-6 bg-white/90 backdrop-blur-2xl shadow-2xl rounded-t-[2.5rem]">
        <a class="flex flex-col items-center justify-center text-[#2d2f2f] px-6 py-2 active:scale-110 transition-all hover:text-[#6d5a00]" href="../index.html">
            <span class="material-symbols-outlined">home</span>
            <span class="text-[11px] font-bold">Home</span>
        </a>
        <a class="flex flex-col items-center justify-center text-[#2d2f2f] px-6 py-2 active:scale-110 transition-all hover:text-[#6d5a00]" href="seasons.html">
            <span class="material-symbols-outlined">subscriptions</span>
            <span class="text-[11px] font-bold">Seasons</span>
        </a>
        <a class="flex flex-col items-center justify-center bg-[#fdd400] text-[#594a00] rounded-full px-6 py-2 active:scale-110 transition-all" href="favorites.html">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">favorite</span>
            <span class="text-[11px] font-bold">Favorites</span>
        </a>
    </nav>
    
    <script src="js/favorites.js"></script>
    <script src="js/archive.js"></script>
    <script src="js/search.js"></script>
    <script src="js/favorites-page.js"></script>
</body>
</html>
