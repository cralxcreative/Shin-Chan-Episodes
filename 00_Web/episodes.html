<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Episodes</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js" defer></script>
</head>
<body class="bg-surface pb-32">
    
    <header class="fixed top-0 w-full z-50 bg-[#f6f6f6]/80 backdrop-blur-xl flex items-center justify-between px-6 h-16">
        <a href="../index.html">
            <div class="flex items-center gap-4">
                <span class="text-xl font-black tracking-tighter text-[#6d5a00] font-headline">SHIN CHAN</span>
            </div>
        </a>
        <div class="hidden md:flex gap-8 items-center">
            <nav class="flex gap-6 text-[#2d2f2f] font-bold font-headline tracking-tight">
                <a class="text-[#2d2f2f] hover:text-[#6d5a00] hover:scale-105 transition-all" href="../index.html">Home</a>
                <a class="text-[#6d5a00] hover:scale-105 transition-transform border-b-2 border-[#6d5a00]" href="seasons.html">Seasons</a>
                <a class="text-[#2d2f2f] hover:text-[#6d5a00] hover:scale-105 transition-all" href="favorites.html">Favorites</a>
            </nav>
            <button class="material-symbols-outlined text-[#2d2f2f] hover:scale-105 transition-transform">search</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 mt-8">
        <!-- Season Header -->
        <section class="relative overflow-hidden bg-surface-container-low rounded-xl p-8 mb-12 flex flex-col md:flex-row gap-8 items-end">
            <div class="relative z-10 flex-1">
                <div class="flex items-center gap-3 mb-4">
                    <span class="bg-tertiary-container text-on-tertiary-container px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest">Clásico Moderno</span>
                    <span class="text-on-surface-variant text-sm font-semibold" id="season-info">Cargando...</span>
                </div>
                <h1 class="text-5xl md:text-7xl font-extrabold text-on-surface tracking-tighter mb-4 leading-tight" id="season-title">Cargando temporada...</h1>
                <p class="text-on-surface-variant text-lg max-w-2xl leading-relaxed mb-8">
                    Acompaña a Shin-chan en sus travesuras más icónicas. Una temporada llena de humor irreverente.
                </p>
                <div class="flex flex-wrap gap-4">
                    <button class="bg-primary-container text-on-primary-container px-8 py-4 rounded-full font-bold flex items-center gap-3 shadow-lg hover:scale-105 active:scale-95 transition-all" onclick="playRandomEpisode()">
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span> Random Episode
                    </button>
                </div>
            </div>
            <div class="hidden md:block w-1/3 -mb-12 -mr-8">
                <img id="season-cover" alt="" class="rounded-lg shadow-2xl transform rotate-3 w-full max-h-96 object-cover bg-surface-container" />
            </div>
        </section>

        <!-- Episodes List -->
        <section class="space-y-4">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-3xl font-bold tracking-tight text-on-surface">Lista de Episodios</h2>
                <div class="text-sm text-on-surface-variant font-semibold">
                    <span id="episode-count">0</span> episodios
                </div>
            </div>
            
            <div id="episodes-container" class="space-y-3">
                <!-- Episodes will be loaded here -->
                <div class="text-center py-12">
                    <div class="animate-pulse flex justify-center gap-2">
                        <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay: 0s;"></div>
                        <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
                        <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay: 0.4s;"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Mobile Navigation -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-3 pb-6 bg-white/90 backdrop-blur-2xl shadow-2xl rounded-t-[2.5rem]">
        <a class="flex flex-col items-center justify-center text-[#2d2f2f] px-6 py-2 active:scale-110 transition-all hover:text-[#6d5a00]" href="../index.html">
            <span class="material-symbols-outlined">home</span>
            <span class="text-[11px] font-bold">Home</span>
        </a>
        <a class="flex flex-col items-center justify-center bg-[#fdd400] text-[#594a00] rounded-full px-6 py-2 active:scale-110 transition-all" href="seasons.html">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">subscriptions</span>
            <span class="text-[11px] font-bold">Seasons</span>
        </a>
        <a class="flex flex-col items-center justify-center text-[#2d2f2f] px-6 py-2 active:scale-110 transition-all hover:text-[#6d5a00]" href="favorites.html">
            <span class="material-symbols-outlined">favorite</span>
            <span class="text-[11px] font-bold">Favorites</span>
        </a>
    </nav>

    <script src="js/favorites.js"></script>
    <script src="js/archive.js"></script>
    <script src="js/search.js"></script>
    <script src="js/episodes.js"></script>
</body>
</html>
